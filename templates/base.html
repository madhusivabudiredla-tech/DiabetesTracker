<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Intelligence & Diagnostic Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='index.css') }}">
</head>
<body class="selection:bg-indigo-500 selection:text-white">

    <header class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 border border-white/10">
                    <i class="fa-solid fa-heart-pulse text-white text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-tight text-white block leading-none">NeuroHealth AI</span>
                    <span class="text-[10px] text-indigo-400 font-mono tracking-widest uppercase mt-1 block">Clinical Decision Support Node</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-6">
                <nav class="flex items-center space-x-4">
                    <a href="/" class="text-xs font-medium text-slate-300 hover:text-indigo-400 transition-colors">Portal</a>
                    <a href="/history" class="text-xs font-medium text-slate-300 hover:text-indigo-400 transition-colors">Patient History</a>
                </nav>

                <div class="flex items-center space-x-2 border-l border-slate-800 pl-4">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs font-mono text-slate-300">FastAPI Engine Live</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Final Year Research Prototype. Built for Academic Defense.</p>
    </footer>

</body>
</html>
